# Check every workspace crate, feature, and target (no target filtering).
[graph]
all-features = true

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    # File-level copyleft; commercial-distribution obligations: docs/licensing.md.
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
