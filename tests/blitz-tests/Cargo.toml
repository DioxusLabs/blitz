[package]
name = "blitz-tests"
description = "Integration tests for Blitz"
publish = false
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true

[features]
default = ["parley"]
# The text backend, which is Parley: on by default, and required.
parley = ["blitz-dom/parley", "blitz-paint/parley", "blitz-html/parley", "blitz-test-harness/parley", "dioxus-native-dom/parley"]

[dev-dependencies]
# Blitz dependencies
blitz-test-harness = { workspace = true }
blitz-dom = { workspace = true, features = ["accessibility", "autofocus", "floats", "system-fonts", "text-transform-icu"] }
blitz-html = { workspace = true }
blitz-traits = { workspace = true }
blitz-paint = { workspace = true, features = ["scrollbars", "svg"] }
dioxus-native-dom = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }

# DioxusLabs dependencies
dioxus = { workspace = true }
dioxus-core = { workspace = true }

# Other dependencies
style = { workspace = true }
accesskit = { workspace = true }
markup5ever = { workspace = true }
keyboard-types = { workspace = true }
taffy = { workspace = true }
kurbo = { workspace = true }
test-that = { workspace = true }
usvg = { workspace = true }

[lib]
path = "lib.rs"

[[test]]
name = "all"
path = "tests/all.rs"
