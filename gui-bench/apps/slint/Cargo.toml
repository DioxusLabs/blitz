[package]
name = "bench-slint"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bench-core = { path = "../../bench-core" }
slint = "1.18"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Standalone workspace: each toolkit pins its own wgpu/winit versions.
[workspace]
