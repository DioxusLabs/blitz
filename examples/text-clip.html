<!DOCTYPE html>
<html>
<head>
<title>background-clip: text</title>
<style>
  body { font-family: sans-serif; padding: 24px; background: #fafafa; }
  .clip { background-clip: text; -webkit-background-clip: text; color: transparent; font-weight: 900; margin: 0 0 16px; }
  .gradient { font-size: 64px; background-image: linear-gradient(104deg, #2379f4 20%, #6b0dff 60%); }
  .rainbow { font-size: 48px; background-image: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet); }
  .radial { font-size: 56px; background-image: radial-gradient(circle at 30% 50%, #ffd54f, #e65100 70%); }
  .stripes { font-size: 56px; background-image: repeating-linear-gradient(45deg, #222 0 6px, #e91e63 6px 12px); }
  .solid { font-size: 40px; background-color: rgb(0 0 255); color: rgb(255 0 0 / 0.5); }
  .layers { font-size: 48px; background: linear-gradient(transparent 55%, rgb(255 235 59 / 0.8) 55%) border-box, linear-gradient(90deg, #00897b, #3949ab) text; }
  .decorated { font-size: 40px; background-image: linear-gradient(90deg, #43a047, #1e88e5); text-decoration: underline; text-decoration-thickness: 6px; }
  .multiline { font-size: 32px; width: 360px; background-image: linear-gradient(180deg, #ff6f00, #6a1b9a); }
  .descendants { font-size: 36px; background-image: linear-gradient(90deg, #d81b60, #8e24aa, #3949ab); }
  .descendants .ib { display: inline-block; transform: rotate(-6deg); }
  .descendants .op { opacity: 0.3; }
  .descendants .abs { position: absolute; }
  .clipped-box { font-size: 40px; padding: 8px 16px; border: 4px dashed #999; background-image: linear-gradient(90deg, #f4511e, #fdd835); }
</style>
</head>
<body>
  <h1 class="clip gradient">Gradient heading</h1>
  <p class="clip rainbow">Rainbow text</p>
  <p class="clip radial">Radial gradient</p>
  <p class="clip stripes">Striped text</p>
  <p class="clip solid">Solid colour under translucent text</p>
  <p class="clip layers">Text clip + border-box layer</p>
  <p class="clip decorated">Decorations are clipped too</p>
  <p class="clip multiline">A longer paragraph that wraps over several lines shares one gradient.</p>
  <div class="clip descendants">Parent <span class="ib">inline-block</span> <span class="op">opacity</span> <b>bold</b><div>Block child</div></div>
  <p class="clip clipped-box">Padding and border</p>
</body>
</html>
