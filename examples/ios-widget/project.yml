name: BlitzWidgetDemo
options:
  bundleIdPrefix: com.dioxuslabs.blitz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  BlitzWidgetDemo:
    type: application
    platform: iOS
    sources:
      - BlitzWidgetDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dioxuslabs.blitz.widgetdemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Blitz Widgets"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: BlitzWidgetExt
        embed: true
  BlitzWidgetExt:
    type: app-extension
    platform: iOS
    sources:
      - BlitzWidgetExt
      - Shared
    info:
      path: BlitzWidgetExt/Info.plist
      properties:
        CFBundleDisplayName: "Blitz Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dioxuslabs.blitz.widgetdemo.widgets
        SWIFT_OBJC_BRIDGING_HEADER: Shared/include/blitz_widget.h
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release"
        OTHER_LDFLAGS:
          - "-lblitz_widget_ffi"
        SKIP_INSTALL: YES
