[package]
name = "todomvc"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[[bin]]
name = "todomvc_native"
path = "src/main.rs"

[lib]
crate-type = ["cdylib"]

[features]
default = ["hybrid"]
vello = ["dioxus-native/vello"]
hybrid = ["dioxus-native/vello-hybrid"]
skia = ["dioxus-native/skia"]
cpu = ["cpu-pixels"]
cpu-pixels = ["dioxus-native/vello-cpu-pixels"]
cpu-softbuffer = ["dioxus-native/vello-cpu-softbuffer"]
log-times = ["log-frame-times", "log-phase-times"]
log-frame-times = ["dioxus-native/log-frame-times"]
log-phase-times = ["dioxus-native/log-phase-times"]
floats = ["dioxus-native/floats"]
tracing = ["dioxus-native/tracing", "dep:tracing-subscriber"]
hot-reload = ["dioxus-native/hot-reload"]
# F12 / Cmd+Option+I / Ctrl+Shift+I open devtools (Chrome's own frontend,
# where Chrome can be launched directly, e.g. on macOS; elsewhere they print
# a `devtools://` URL to paste into Chrome)
devtools = ["dioxus-native/devtools"]
# Serve devtools' frontend from the app, so the shortcuts open it in your
# browser (e.g. Chrome or Firefox) on any platform
embedded-devtools-frontend = ["devtools", "dioxus-native/embedded-devtools-frontend"]

[dependencies]
tracing-subscriber = { workspace = true, optional = true }

# Disable unicode URL support
# See https://github.com/hsivonen/idna_adapter
idna_adapter = "=1.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-native = { workspace = true, features = ["svg", "system-fonts", "data-uri", "prelude"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-native = { workspace = true, features = ["svg", "data-uri", "prelude", "vello-hybrid", "woff"] }
anyrender_vello_hybrid = { workspace = true, features = ["webgl"] }
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.0", features = ["native-activity"] }
