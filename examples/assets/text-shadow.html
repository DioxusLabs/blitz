<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Shadow Examples</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 32px;
      line-height: 1.6;
      color: #1f2937;
      background: white;
    }

    p {
      margin: 24px 0;
      font-size: 32px;
      font-weight: 700;
    }

    .soft-shadow {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.35);
    }

    .glow {
      color: #2563eb;
      text-shadow: 0 0 8px rgba(37, 99, 235, 0.75);
    }

    .offset-red {
      text-shadow: 4px 3px 0 #ef4444;
    }

    .layered {
      color: #111827;
      text-shadow: 1px 1px 0 #facc15, 3px 3px 0 #f97316;
    }

    .blurred-purple {
      color: #7c3aed;
      text-shadow: -3px 3px 6px rgba(124, 58, 237, 0.55);
    }

    h2 {
      margin: 48px 0 0;
      font-size: 20px;
      color: #6b7280;
    }

    .pulsing-glow {
      color: #2563eb;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 2px rgba(37, 99, 235, 0.3); }
      to { text-shadow: 0 0 16px rgba(37, 99, 235, 1); }
    }

    .orbiting {
      animation: orbit 2s linear infinite;
    }

    @keyframes orbit {
      0%, 100% { text-shadow: 6px 0 2px #ef4444; }
      25% { text-shadow: 0 6px 2px #ef4444; }
      50% { text-shadow: -6px 0 2px #ef4444; }
      75% { text-shadow: 0 -6px 2px #ef4444; }
    }

    .color-cycle {
      animation: cycle 3s linear infinite;
    }

    @keyframes cycle {
      0%, 100% { text-shadow: 2px 2px 0 #facc15, 4px 4px 0 #f97316; }
      33% { text-shadow: 2px 2px 0 #22c55e, 4px 4px 0 #14b8a6; }
      66% { text-shadow: 2px 2px 0 #a855f7, 4px 4px 0 #ec4899; }
    }

    /* Interpolates from one shadow to four: the missing ones animate from zero. */
    .extruding {
      color: #f97316;
      animation: extrude 2s ease-in-out infinite alternate;
    }

    @keyframes extrude {
      from { text-shadow: 0 0 0 #c2410c; }
      to { text-shadow: 1px 1px 0 #c2410c, 2px 2px 0 #c2410c, 3px 3px 0 #c2410c, 4px 4px 0 #9a3412; }
    }

    .hover-lift {
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.3);
      transition: text-shadow 0.3s;
      cursor: pointer;
    }

    .hover-lift:hover {
      text-shadow: 4px 8px 8px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <p class="soft-shadow">Soft shadow</p>
  <p class="glow">Blue glow</p>
  <p class="offset-red">Red offset</p>
  <p class="layered">Layered shadow</p>
  <p class="blurred-purple">Purple blur</p>

  <h2>Animated</h2>
  <p class="pulsing-glow">Pulsing glow</p>
  <p class="orbiting">Orbiting shadow</p>
  <p class="color-cycle">Colour cycle</p>
  <p class="extruding">Extruding</p>
  <p class="hover-lift">Hover to lift</p>
</body>
</html>
