name: Compare dependency WPT

on:
  workflow_call:
    inputs:
      run-info:
        description: Resolved dependency, Blitz and WPT commits for the comparison
        required: true
        type: string

permissions:
  contents: read

jobs:
  wpt:
    name: WPT (${{ matrix.name }})
    runs-on: ${{ startsWith(github.repository, 'DioxusLabs/') && 'warp-ubuntu-latest-arm64-16x' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            blitz: ${{ fromJSON(inputs.run-info).blitz_base }}
            dependency: ${{ fromJSON(inputs.run-info).dependency_base }}
          - name: candidate
            blitz: ${{ fromJSON(inputs.run-info).blitz_head }}
            dependency: ${{ fromJSON(inputs.run-info).dependency_head }}
    env:
      WPT_DIR: ${{ github.workspace }}/wpt-tests
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: Checkout Blitz
        uses: actions/checkout@v5
        with:
          repository: DioxusLabs/blitz
          ref: ${{ matrix.blitz }}
          path: blitz
          persist-credentials: false
      - name: Checkout dependency
        uses: actions/checkout@v5
        with:
          repository: ${{ fromJSON(inputs.run-info).repository }}
          ref: ${{ matrix.dependency }}
          path: dependency
          persist-credentials: false
      - name: Checkout comparison tools
        uses: actions/checkout@v5
        with:
          repository: DioxusLabs/blitz
          ref: ${{ fromJSON(inputs.run-info).tools_revision }}
          path: tools
          persist-credentials: false
      - name: Use the dependency checkout
        env:
          DEPENDENCY: ${{ fromJSON(inputs.run-info).dependency }}
        run: python3 tools/.github/scripts/wpt_comparison.py use-checkout blitz/Cargo.toml "$DEPENDENCY" dependency
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: blitz-wpt-linux
          workspaces: blitz
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          cache-provider: ${{ startsWith(github.repository, 'DioxusLabs/') && 'warpbuild' || 'github' }}
      - name: Install Fontconfig and fonts
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev fonts-tlwg-loma-otf
      - name: Clone WPT tests
        env:
          WPT_REVISION: ${{ fromJSON(inputs.run-info).wpt_revision }}
        run: git clone --depth 1 --revision "$WPT_REVISION" https://github.com/web-platform-tests/wpt "$WPT_DIR"
      - name: Run WPT with the dependency checkout
        working-directory: blitz
        run: cargo run -rp wpt css svg
      - name: Compress report
        run: zstd -19 -o wptreport.json.zst blitz/wpt/output/wptreport.json
      - uses: actions/upload-artifact@v7
        with:
          name: wpt-report-${{ matrix.name }}
          path: wptreport.json.zst

  compare:
    name: Compare WPT results
    needs: wpt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout comparison tools
        uses: actions/checkout@v5
        with:
          repository: DioxusLabs/blitz
          ref: ${{ fromJSON(inputs.run-info).tools_revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: wpt-report-base
          path: reports/base
      - uses: actions/download-artifact@v7
        with:
          name: wpt-report-candidate
          path: reports/candidate
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WPT comparison CLI
        run: cargo install --locked wpt@0.0.14
      - name: Diff WPT results
        run: |
          mkdir -p comparison
          zstd -d reports/base/wptreport.json.zst -o reports/base/wptreport.json
          zstd -d reports/candidate/wptreport.json.zst -o reports/candidate/wptreport.json
          wpt diff reports/base/wptreport.json reports/candidate/wptreport.json | tee comparison/wptdiff.txt
          wpt diff --verbose --format json reports/base/wptreport.json reports/candidate/wptreport.json > comparison/wptdiff.json
          python3 .github/scripts/wpt_area_changes.py reports/base/wptreport.json reports/candidate/wptreport.json > comparison/wptareas.json
      - name: Render comparison summary
        env:
          RUN_INFO: ${{ inputs.run-info }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/wpt_comparison.py summary comparison
      - uses: actions/upload-artifact@v7
        with:
          name: wpt-diff
          path: comparison/
