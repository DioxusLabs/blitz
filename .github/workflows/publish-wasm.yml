# Builds the web viewer (apps/web-viewer: renders one web page with the WebGL
# vello_hybrid renderer) and uploads it as the `blitz-wasm-demo` artifact. The
# latest successful run of this workflow on a push to main is the published
# build: blitz-website fetches its artifact through the GitHub API, as it does
# for the Publish Browser downloads.
#
# The artifact is a static site with relative URLs (index.html, the wasm and its
# JS glue). See apps/web-viewer/src/lib.rs for its query parameters (?url=,
# ?proxy=) and the postMessage interface for the embedding page.
name: Publish Wasm Demo
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/publish-wasm.yml
      - apps/web-viewer/**
  workflow_dispatch:

jobs:
  build-wasm-demo:
    name: Build wasm demo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Trunk fetches the wasm-bindgen CLI matching Cargo.lock and wasm-opt
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1

      - name: Build web viewer
        working-directory: apps/web-viewer
        run: |
          trunk build --release --locked --public-url ./ --dist "$GITHUB_WORKSPACE/wasm-demo"
          ls -l "$GITHUB_WORKSPACE/wasm-demo"

      - name: Upload wasm demo
        uses: actions/upload-artifact@v7
        with:
          name: blitz-wasm-demo
          path: wasm-demo
          if-no-files-found: error
