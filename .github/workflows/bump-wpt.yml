name: Bump WPT revision

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: "Bump pinned WPT revision"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Resolve upstream WPT master
        id: upstream
        run: |
          set -euo pipefail
          current=$(sed -nE 's/^  WPT_COMMIT: "([0-9a-f]{40})"$/\1/p' .github/workflows/wpt.yml)
          latest=$(git ls-remote https://github.com/web-platform-tests/wpt refs/heads/master | cut -f1)
          [ -n "$current" ] && [ -n "$latest" ]
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "short=${latest:0:9}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Update WPT_COMMIT
        if: steps.upstream.outputs.current != steps.upstream.outputs.latest
        run: |
          sed -i "s/${{ steps.upstream.outputs.current }}/${{ steps.upstream.outputs.latest }}/" .github/workflows/wpt.yml
          # Fail loudly if the substitution did not take effect.
          ! git diff --quiet -- .github/workflows/wpt.yml

      - name: Open pull request
        if: steps.upstream.outputs.current != steps.upstream.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Bump pinned WPT revision to `${{ steps.upstream.outputs.short }}` (${{ steps.upstream.outputs.date }})"
          BRANCH: "ci/bump-wpt-${{ steps.upstream.outputs.short }}"
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "$TITLE"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated weekly bump of \`WPT_COMMIT\` in \`.github/workflows/wpt.yml\`.

          \`${{ steps.upstream.outputs.current }}\` → \`${{ steps.upstream.outputs.latest }}\`

          Compare: https://github.com/web-platform-tests/wpt/compare/${{ steps.upstream.outputs.current }}...${{ steps.upstream.outputs.latest }}"
