[package]
name = "blitz-widget-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "C/JNI FFI for rendering HTML/CSS to pixel buffers with Blitz, for native home-screen/lock-screen widgets"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }
blitz-dom = { workspace = true, features = ["default"] }
blitz-html = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
peniko = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
png = { workspace = true }
