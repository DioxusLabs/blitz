[package]
name = "blitz-shell"
description = "Blitz application shell"
documentation = "https://docs.rs/blitz-shell"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["accessibility", "file-dialog"]
accessibility = [
    "dep:accesskit",
    "dep:accesskit_xplat",
    "blitz-dom/accessibility",
]
tracing = ["dep:tracing", "blitz-dom/tracing"]
file-dialog = ["dep:rfd"]
# Enables a data-uri-only NetProvider. Only needed if you aren't using the regular NetProvider
data-uri = ["dep:data-url"]
# Enables the Chrome DevTools Protocol server (started via the BLITZ_CDP_PORT env var
# or on demand by `ShellProvider::open_devtools`)
devtools = ["dep:blitz-vibey-cdp-server", "dep:webbrowser"]
# Embeds a DevTools frontend (about 2 MB) in the CDP server, which `open_devtools`
# opens in the browser. Without it, `open_devtools` opens Chrome's own frontend
# where Chrome can be launched directly (e.g. macOS), and otherwise prints a
# `devtools://` URL to paste into Chrome.
embedded-devtools-frontend = ["devtools", "blitz-vibey-cdp-server/embedded-frontend"]
custom-widget = ["blitz-dom/custom-widget"]

[dependencies]
# Blitz dependencies
blitz-traits = { workspace = true }
blitz-dom = { workspace = true }
blitz-paint = { workspace = true }
blitz-vibey-cdp-server = { workspace = true, optional = true }
anyrender = { workspace = true }

# Windowing & Input
winit = { workspace = true }
keyboard-types = { workspace = true }
accesskit = { workspace = true, optional = true }
accesskit_xplat = { workspace = true, optional = true }

# Other dependencies
atomic_refcell = { workspace = true }
tracing = { workspace = true, optional = true }
futures-util = { workspace = true }
data-url = { workspace = true, optional = true }
webbrowser = { workspace = true, optional = true }

# WASM
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["HtmlCanvasElement", "Window"] }
wasm-bindgen = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.0" }

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux",target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
rfd = { workspace = true, optional = true, features = ["xdg-portal"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
