[package]
name = "blitz-test-harness"
description = "Headless test harness for Blitz documents"
publish = false
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Blitz dependencies
blitz-dom = { workspace = true, features = ["accessibility", "system-fonts"] }
blitz-html = { workspace = true }
blitz-paint = { workspace = true, features = ["default"] }
blitz-traits = { workspace = true }
dioxus-native-dom = { workspace = true }

# DioxusLabs dependencies
dioxus-core = { workspace = true }

# Rendering dependencies
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }
peniko = { workspace = true }
png = { workspace = true }

# Other dependencies
data-url = { workspace = true }
keyboard-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
smol_str = { workspace = true }
