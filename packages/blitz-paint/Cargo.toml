[package]
name = "blitz-paint"
description = "Paint a Blitz Document using anyrender"
documentation = "https://docs.rs/blitz-paint"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["svg"]
tracing = ["dep:tracing"]
# SVG backends, see blitz-dom. `svg` is an alias for `svg-usvg`.
svg = ["svg-usvg"]
svg-usvg = ["dep:anyrender_svg", "dep:usvg", "dep:svgtypes", "blitz-dom/svg-usvg"]
svg-native = ["dep:svgtypes", "blitz-dom/svg-native"]
custom-widget = ["blitz-dom/custom-widget"]
font-embolden = []
apple-font-embolden = []
# Paint overlay scrollbar thumbs on scroll containers, and enable their
# drag/hover interaction in blitz-dom (off by default while the feature
# matures).
scrollbars = ["blitz-dom/scrollbars"]

[dependencies]
# Blitz dependencies
anyrender = { workspace = true }
anyrender_svg = { workspace = true, optional = true }
usvg = { workspace = true, optional = true }
svgtypes = { workspace = true, optional = true }
blitz-traits = { workspace = true }
blitz-dom = { workspace = true }

# Servo dependencies
style = { workspace = true }
markup5ever = { workspace = true }

# DioxusLabs dependencies
taffy = { workspace = true }

# Linebender + WGPU dependencies
parley = { workspace = true, features = ["bytemuck"] }
skrifa = { workspace = true }
color = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
euclid = { workspace = true }

# Other dependencies
bytemuck = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true, optional = true }
